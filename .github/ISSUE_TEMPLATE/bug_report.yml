name: Bug Report
description: File a defect report with reproducible steps
title: "[BUG]: "
labels: ["type: bug", "status: triage-needed", "priority: medium (P2)"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve our platform! Please provide as much detail as possible.
  - type: input
    id: app_version
    attributes:
      label: Environment / Version
      description: What version, operating system, or browser were you using?
      placeholder: e.g., v1.4.2 on Chrome 127 / macOS
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Exact steps to reproduce the error.
      placeholder: |
        1. Navigate to...
        2. Click on...
        3. See error...
    validations:
      required: true
  - type: textarea
    id: expected_vs_actual
    attributes:
      label: Expected vs. Actual Result
      description: What did you expect to happen versus what actually happened?
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: User Impact Severity
      options:
        - Critical (Outage / Data corruption)
        - High (Core feature broken, no workaround)
        - Medium (Non-critical defect with workaround)
        - Low (Cosmetic / UI glitch)
    validations:
      required: true
